sonar.projectKey=ifs24010-pabwe2026-sk-p5-vue
sonar.projectName=ifs24010-pabwe2026-sk-p5-vue
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Kode sumber dan pengujian
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js
sonar.exclusions=**/*.test.js,src/setupTests.js,src/test-utils.js,**/node_modules/**,coverage/**,dist/**

# Coverage (dihasilkan oleh `bun run test:coverage`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.js,src/setupTests.js,src/test-utils.js,**/*.test.js

# Duplikasi: berkas pengujian tidak dihitung
sonar.cpd.exclusions=**/*.test.js
